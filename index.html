<style>
:root{
  --paper:#FFFCF6;--ink:#3E3A39;
  --coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;--lav:#D6C9EC;
  --coral-p:#FCE4DF;--yellow-p:#FDF3D3;--sky-p:#E1F0F7;--green-p:#E8F3DF;--lav-p:#EFEAF8;
  --font:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0}
html{overflow-x:hidden;max-width:100%;scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.7;font-size:16px;overflow-x:clip;max-width:100%;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
button,input{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-weight:400;line-height:1.25}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.c-coral{--dc:var(--coral);--dp:var(--coral-p)}
.c-sky{--dc:var(--sky);--dp:var(--sky-p)}
.c-green{--dc:var(--green);--dp:var(--green-p)}
.c-lav{--dc:var(--lav);--dp:var(--lav-p)}
.c-yellow{--dc:var(--yellow);--dp:var(--yellow-p)}

/* ───────── 共用元件 ───────── */
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-size:15px;line-height:1.4;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover{background:var(--yellow-p)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.sm{padding:2px 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.sm:active{transform:translate(2px,2px)}
.btn.sm .ic{width:15px;height:15px}
.btn.fill{background:var(--yellow)}
.btn[disabled]{opacity:.45;pointer-events:none}
.tag{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:12px;line-height:1.6;background:var(--paper)}
.tg-sky{background:var(--sky)}.tg-green{background:var(--green)}.tg-yellow{background:var(--yellow)}.tg-coral{background:var(--coral)}.tg-lav{background:var(--lav)}
.card{border:3px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:5px 5px 0 var(--ink)}
.sec{max-width:1040px;margin:0 auto;padding:60px 16px 8px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sticker{width:62px;height:62px;flex:none;border:3px solid var(--ink);border-radius:20px;background:var(--dc);display:grid;place-items:center;transform:rotate(-5deg);box-shadow:3px 3px 0 var(--ink)}
.sticker svg{width:46px;height:46px}
.sec-h h2{font-size:clamp(26px,7vw,36px)}
.sec-h p{font-size:14px;opacity:.75}

/* ───────── 頂端選單 ───────── */
.nav{position:fixed;z-index:100;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;max-width:1024px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:3px 3px 0 var(--ink);padding:5px 8px 0}
.nav-row{display:flex;align-items:center;gap:6px;height:38px}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none;font-size:18px;white-space:nowrap;padding-right:4px}
.brand svg{width:34px;height:26px}
.brand span{display:none}
.links{display:flex;gap:2px;flex:1;min-width:0;padding:4px 4px;overflow-x:auto;scrollbar-width:none}
.links a:first-child{margin-left:auto}.links a:last-child{margin-right:auto}
.links::-webkit-scrollbar{display:none}
.links a{text-decoration:none;padding:3px 11px;border-radius:999px;border:3px solid transparent;font-size:15px;white-space:nowrap;transition:background .15s,transform .2s cubic-bezier(.3,1.8,.5,1)}
.links a.on{background:var(--yellow);border-color:var(--ink);transform:rotate(-3deg)}
#motionBtn{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center;position:relative}
#motionBtn[aria-pressed="true"]{background:var(--coral)}
#motionBtn[aria-pressed="true"]::after{content:"";position:absolute;width:26px;height:3px;background:var(--ink);transform:rotate(-45deg);border-radius:2px}
.road{position:relative;height:20px;margin:0 6px;border-top:0}
.road::before{content:"";position:absolute;left:0;right:0;bottom:3px;border-bottom:3px dashed var(--ink);opacity:.35}
#roadCar{position:absolute;bottom:2px;left:0;width:26px;height:20px}
@media(min-width:560px){.brand span{display:inline}}

/* ───────── 首頁 ───────── */
.hero{max-width:1040px;margin:84px auto 0;padding:0 12px}
.hero-card{position:relative;border:3px solid var(--ink);border-radius:36px;background:var(--sky);overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.hero-copy{position:relative;z-index:3;text-align:center;padding:26px 14px 0}
.title{font-size:clamp(54px,17vw,104px);letter-spacing:.04em;line-height:1.1;text-shadow:4px 4px 0 var(--yellow)}
.title span{display:inline-block;animation:drop .8s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 110ms)}
@keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(-14deg) scale(.6)}100%{opacity:1;transform:none}}
.hero-sub{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.pill{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 14px;font-size:15px;line-height:1.7}
.pill.y{background:var(--yellow);transform:rotate(-3deg);font-size:17px}
.pill.c{background:var(--coral);transform:rotate(2deg)}
.hero-lead{margin-top:10px;font-size:15px;max-width:30em;margin-inline:auto}
.hero-art{position:relative;height:clamp(236px,62vw,420px);margin-top:-6px}
.hero-art svg{display:block;width:100%;height:100%}
.ly{will-change:transform}
.ly.far{transform:translate3d(0,calc(var(--py,0px) * .3),0)}
.ly.mid{transform:translate3d(0,calc(var(--py,0px) * .6),0)}
.ly.near{transform:translate3d(0,var(--py,0px),0)}
.rays{animation:spin 26s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{animation:cloud 18s ease-in-out infinite alternate}
.cl.c2{animation-duration:24s;animation-delay:-8s}
.cl.c3{animation-duration:21s;animation-delay:-3s}
@keyframes cloud{from{transform:translateX(-26px)}to{transform:translateX(34px)}}
.pf{transform-box:fill-box;transform-origin:center;animation:smoke 4.2s ease-out infinite;opacity:0}
.pf.p2{animation-delay:1.4s}.pf.p3{animation-delay:2.8s}
@keyframes smoke{0%{opacity:0;transform:translate(0,10px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-62px) scale(1.5)}}
.st{animation:steam 3.4s ease-in-out infinite;opacity:0}
.st.s2{animation-delay:1.1s}.st.s3{animation-delay:2.2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.cruise{animation:cruise 24s linear infinite}
@keyframes cruise{from{transform:translateX(-130px)}to{transform:translateX(900px)}}
.bob{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.2}}
.dashroad{animation:roadflow 1.2s linear infinite}
@keyframes roadflow{to{stroke-dashoffset:-44}}

.count-card{position:relative;z-index:5;margin:-22px 10px 0;padding:16px 14px 14px;background:var(--paper)}
.count-card h2{font-size:18px;text-align:center;margin-bottom:10px}
.cd-big{display:flex;justify-content:center;align-items:baseline;gap:10px;line-height:1}
.cd-big b{font-weight:400;font-size:clamp(84px,28vw,132px);text-shadow:5px 5px 0 var(--coral);letter-spacing:.02em}
.cd-big span{font-size:clamp(26px,8vw,38px)}
.cds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:6px auto 0}
.track{display:flex;align-items:flex-end;gap:8px;margin:16px 4px 0}
.tk-lab{font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--yellow);line-height:1.6;align-self:center}
.tk-road{position:relative;flex:1;height:32px;border-bottom:3px dashed var(--ink)}
#tkCar{position:absolute;bottom:-1px;left:0;width:42px;height:32px;transition:left 1s cubic-bezier(.3,1.3,.5,1)}
.tk-end{width:46px;height:46px;flex:none;margin-bottom:-4px;animation:hop 1.6s ease-in-out infinite}
.cd{border:3px solid var(--ink);border-radius:20px;text-align:center;padding:6px 0 4px;box-shadow:3px 3px 0 var(--ink)}
.cd:nth-child(1){background:var(--yellow)}.cd:nth-child(2){background:var(--sky)}.cd:nth-child(3){background:var(--green)}
.cd b{display:block;font-weight:400;font-size:clamp(26px,8vw,38px);line-height:1.2}
.cd small{font-size:12px}
.cd b.tick{animation:tick .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes tick{0%{transform:translateY(-8px) scale(.85)}100%{transform:none}}
.cd-msg{text-align:center;margin-top:10px;font-size:15px}
.cd-set{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;margin-top:10px;font-size:14px}
.cd-set input{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:2px 10px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0 0}

/* ───────── 航班 ───────── */
.passes{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:820px){.passes{grid-template-columns:1fr 1fr}}
.pass{position:relative;overflow:hidden;background:var(--paper)}
.pass-top{padding:16px 16px 14px;background:var(--dc)}
.pass-tag{display:inline-block;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 12px;font-size:14px;transform:rotate(-2deg)}
.route-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;margin-top:10px}
.code{text-align:center;min-width:0}
.code b{display:block;font-weight:400;font-size:clamp(26px,8vw,34px);line-height:1.1}
.code small{font-size:12px}
.code input{width:100%;max-width:84px;min-width:0;text-align:center;font-size:clamp(24px,7vw,30px);border:0;border-bottom:3px dashed var(--ink);background:transparent;border-radius:0;padding:0;text-transform:uppercase}
.code input::placeholder{opacity:.35}
.arc{position:relative;width:96px;height:40px}
.arc svg.path{position:absolute;inset:0;width:100%;height:100%}
.fly{position:absolute;left:0;top:0;width:28px;height:28px;offset-path:path('M5 34 Q48 -12 91 34');offset-rotate:auto;offset-anchor:50% 50%;animation:fly 5.5s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.pass-tear{position:relative;border-top:3px dashed var(--ink);margin:0 18px}
.pass-tear::before,.pass-tear::after{content:"";position:absolute;top:-14px;width:24px;height:24px;border:3px solid var(--ink);border-radius:50%;background:var(--paper)}
.pass-tear::before{left:-33px}.pass-tear::after{right:-33px}
.pass-bot{padding:14px 16px 16px}
.pass-bot p{font-size:14px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.fields>div{min-width:0}
.fields label{display:block;font-size:12px}
.fields input{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:40px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:3px 10px;font-size:15px}
.splits{display:grid;gap:8px;margin-top:8px}
.split-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:14px}
.who{border:3px solid var(--ink);border-radius:999px;padding:0 12px;background:var(--dc)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ───────── 每日行程 ───────── */
.tabs{position:sticky;top:78px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 -16px 6px;padding:8px 16px 14px;background:var(--paper)}
.tab{border:3px solid var(--ink);border-radius:18px;background:var(--paper);padding:5px 0 3px;line-height:1.25;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:background .15s}
.tab b{display:block;font-weight:400;font-size:16px}
.tab small{display:block;font-size:12px;opacity:.8}
.tab[aria-selected="true"]{background:var(--dc);transform:translateY(-3px);box-shadow:0 6px 0 var(--ink);animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:translateY(0) scale(.84)}55%{transform:translateY(-10px) scale(1.14,.94)}100%{transform:translateY(-3px) scale(1)}}
.swap{animation:swap .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes swap{0%{opacity:0;transform:translateY(30px) scale(.97)}60%{opacity:1;transform:translateY(-7px) scale(1.01)}100%{transform:none}}
.day-head{padding:16px 16px 14px;background:var(--dc);margin-bottom:22px}
.dh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dnum{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 14px;font-size:18px;transform:rotate(-3deg)}
.ddate{font-size:16px}
.day-head h3{font-size:clamp(22px,6vw,30px);margin-top:8px}
.day-head p{font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 12px;font-size:13px;line-height:1.6}
.day-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.day-grid>*,.passes>*,.stays>*,.infos>*,.todo-grid>*{min-width:0}
.card-it,.drive-pill,.note,.stay-bot,.pass-bot{overflow-wrap:anywhere}
@media(min-width:900px){
  .day-grid{grid-template-columns:minmax(380px,.95fr) minmax(0,1.05fr);align-items:start}
  .scene{position:sticky;top:150px}
}

/* 3D 場景 */
.scene{background:var(--dp);overflow:hidden}
.scene-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}
.scene-h h4{font-weight:400;font-size:17px}
.views{display:flex;gap:6px}
.views .btn{padding:0 10px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.stage{position:relative;height:clamp(340px,96vw,440px);perspective:900px;perspective-origin:50% 28%;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.world{--pl:min(64vw,320px);--rx:56deg;--rz:-18deg;position:absolute;left:50%;top:52%;width:var(--pl);height:var(--pl);margin:calc(var(--pl) / -2) 0 0 calc(var(--pl) / -2);transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateZ(var(--rz));border:3px solid var(--ink);border-radius:30px;background:var(--green-p)}
@media(min-width:900px){.world{--pl:min(30vw,360px)}}
.slab{position:absolute;inset:-3px;border:3px solid var(--ink);border-radius:32px;pointer-events:none}
.slab.s1{transform:translateZ(-8px);background:#E3C29B}
.slab.s2{transform:translateZ(-16px);background:#CFA67B}
.slab.s3{transform:translateZ(-24px);background:var(--ink)}
.ground,.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ground{transform:translateZ(1px);border-radius:26px}
.route{transform:translateZ(2px);overflow:visible}
.route .dash{animation:roadflow2 1.4s linear infinite}
@keyframes roadflow2{to{stroke-dashoffset:-4.4}}
.pin{position:absolute;width:60px;height:88px;margin:-88px 0 0 -30px;transform-origin:30px 88px;transform:rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--rx) * -1));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:none;border:0;padding:0;cursor:pointer}
.pin .lm{width:48px;height:48px;flex:none}
.pin .badge{width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:14px;line-height:1;margin-bottom:2px;transition:transform .25s cubic-bezier(.3,1.8,.5,1),background .2s}
.pin .lab{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;line-height:1.55;display:none;margin-bottom:2px;z-index:2}
.pin.on .lab{display:block}
.pin.on .badge{background:var(--yellow);transform:scale(1.22)}
.pin.on .lm{animation:hop 1.3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px) scale(1.06)}}
.pin.tree{width:34px;height:48px;margin:-48px 0 0 -17px;transform-origin:17px 48px;pointer-events:none}
.pin.tree svg{width:100%;height:100%}
.pin.carpin{width:56px;height:42px;margin:-40px 0 0 -28px;transform-origin:28px 40px;pointer-events:none;z-index:3}
.pin.carpin svg{width:100%;height:100%;transition:transform .2s}
.sh{position:absolute;width:34px;height:14px;margin:-7px 0 0 -17px;border-radius:50%;background:rgba(62,58,57,.2);transform:translateZ(3px)}
.gm{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid var(--ink);background:var(--dc);transform:translateZ(4px)}
.gm.on::after{content:"";position:absolute;inset:-9px;border:3px solid var(--ink);border-radius:50%;animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.cloud{position:absolute;left:var(--cx);top:var(--cy);width:88px;height:56px;margin:-56px 0 0 -44px;transform-origin:44px 56px;transform:translateZ(120px) rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--rx) * -1));animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.cloud svg{width:100%;height:100%}
.csh{position:absolute;left:var(--cx);top:var(--cy);width:70px;height:26px;margin:-13px 0 0 -35px;border-radius:50%;background:rgba(62,58,57,.14);transform:translateZ(3px);animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{from{translate:-34px 0}to{translate:34px 8px}}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 10px;pointer-events:none}
.scene-info{border-top:3px solid var(--ink);background:var(--paper);padding:12px 14px 14px}
.si-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);font-size:13px;line-height:1;margin-right:6px;vertical-align:1px}
#curName{font-size:18px}
.si-next{margin-top:6px;font-size:14px;min-height:24px}
.si-next .leg{display:inline-block;border:2px dashed var(--ink);border-radius:999px;padding:0 10px;background:var(--sky-p);font-size:13px}
.step{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

/* 時間軸 */
.tlist{list-style:none;padding:0}
.tl{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:16px;top:30px;bottom:-4px;border-left:3px dashed var(--ink)}
.tl:last-child::before{display:none}
.dot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--dc);display:grid;place-items:center;font-size:14px;line-height:1}
.tl.meal .dot,.tl.note .dot{background:var(--yellow);width:22px;height:22px;margin:6px 0 0 6px}
.tl.drive .dot{width:28px;height:28px;margin:3px 0 0 3px;background:var(--sky)}
.tl.drive .dot svg{width:18px;height:14px}
.tl.on .dot{animation:hop 1.1s ease-in-out infinite;background:var(--yellow)}
.card-it{position:relative;border:3px solid var(--ink);border-radius:22px;background:var(--paper);padding:10px 14px 12px;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.tl.on .card-it{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--ink);background:var(--yellow-p)}
.card-it.must-card{background:var(--coral-p)}
.tl.on .card-it.must-card{background:var(--coral-p)}
.card-it.stay-card{background:var(--lav-p)}
.time{display:inline-block;border:3px solid var(--ink);border-radius:999px;background:var(--dc);padding:0 11px;font-size:13px;line-height:1.55}
.card-it h5{font-weight:400;font-size:19px;margin-top:4px;line-height:1.35}
.card-it .desc{font-size:14px;margin-top:2px}
.note{display:flex;gap:6px;align-items:flex-start;margin-top:8px;padding:6px 10px;font-size:13px;line-height:1.55;border:2px dashed var(--ink);border-radius:14px;background:var(--paper)}
.note .ic{margin-top:3px;width:15px;height:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.must{position:absolute;top:-14px;right:12px;display:inline-flex;align-items:center;gap:4px;background:var(--coral);border:3px solid var(--ink);border-radius:999px;padding:0 12px 0 8px;font-size:14px;line-height:1.5;transform:rotate(4deg);box-shadow:2px 2px 0 var(--ink)}
.must svg{width:15px;height:15px;fill:var(--yellow);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.tl.on .must{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg) scale(1.08)}}
.drive-pill{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:3px dashed var(--ink);border-radius:18px;background:var(--sky-p);padding:3px 12px;font-size:14px;margin-top:2px}
.drive-pill b{font-weight:400}
.drive-pill .dur{font-size:12px;opacity:.8}
.srow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:14px}

/* ───────── 清單 ───────── */
.infos{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:26px}
@media(min-width:820px){.infos{grid-template-columns:repeat(3,1fr);align-items:start}}
details.info{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
details.info summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--dc);font-size:17px}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:"+";margin-left:auto;width:26px;height:26px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;line-height:1;font-size:18px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
details.info[open] summary::after{content:"–";transform:rotate(180deg)}
details.info ol{list-style:none;padding:12px 14px 14px;display:grid;gap:10px;counter-reset:n}
details.info li{display:flex;gap:10px;font-size:14px;line-height:1.6;counter-increment:n}
details.info li::before{content:counter(n);flex:none;width:24px;height:24px;border:3px solid var(--ink);border-radius:50%;background:var(--dc);display:grid;place-items:center;font-size:12px;line-height:1;margin-top:2px}
details.info li b{font-weight:400;display:block;font-size:15px}
.todo-box{padding:16px 14px 12px;background:var(--paper)}
.prog-row{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:24px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.prog i[style*="width: 0%"]{border-right:0}
.prog-txt{font-size:15px;white-space:nowrap}
.prog-msg{margin-top:8px;font-size:15px;min-height:26px}
.todo-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:12px}
@media(min-width:820px){.todo-grid{grid-template-columns:1fr 1fr}}
.tg{border:3px solid var(--ink);border-radius:22px;background:var(--dp);padding:8px 14px 8px}
.tg h4{font-weight:400;font-size:17px;padding:2px 0 4px}
.chk{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;border-top:2px dashed rgba(62,58,57,.35)}
.chk:first-of-type{border-top:0}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:28px;height:28px;margin-top:2px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);display:grid;place-items:center;transition:background .15s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.box svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s .05s}
.chk input:checked + .box{background:var(--green);transform:rotate(-7deg) scale(1.1)}
.chk input:checked + .box svg{stroke-dashoffset:0}
.chk input:focus-visible + .box{outline:3px dashed var(--ink);outline-offset:3px}
.chk .txt b{font-weight:400;font-size:15px;line-height:1.45;display:block}
.chk .txt small{font-size:12.5px;line-height:1.5;display:block;opacity:.8}
.chk input:checked ~ .txt b{text-decoration:line-through;text-decoration-thickness:3px;opacity:.5}
.del{margin-left:auto;flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);cursor:pointer;line-height:1;font-size:14px}
.addrow{display:flex;gap:8px;margin-top:6px;padding:8px 0}
.addrow input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:3px 14px;font-size:15px}

/* ───────── 住宿 ───────── */
.stays{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:760px){.stays{grid-template-columns:1fr 1fr}}
.stay{overflow:hidden;background:var(--paper)}
.stay-top{position:relative;display:flex;align-items:flex-end;gap:10px;background:var(--dc);padding:12px 14px 0;min-height:92px;border-bottom:3px solid var(--ink)}
.stay-top svg{width:76px;height:76px;margin-bottom:-3px;flex:none}
.stay-top .night{position:absolute;right:12px;top:12px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 12px;font-size:14px;transform:rotate(3deg)}
.stay-top div{padding-bottom:10px}
.stay-top h3{font-size:19px}
.stay-top small{font-size:13px}
.stay-bot{padding:12px 14px 16px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-bottom:6px}
.kv dt{opacity:.7}
.kv dd{margin:0}
.checkout{margin-top:22px;padding:14px 16px;background:var(--yellow-p);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer{max-width:1040px;margin:60px auto 0;padding:0 16px calc(36px + env(safe-area-inset-bottom));text-align:center;font-size:13px}
footer svg{width:100%;height:80px;display:block;margin-bottom:6px}

/* ───────── 分享 ───────── */
.sheet-bg{position:fixed;inset:0;z-index:200;background:rgba(62,58,57,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:210;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);visibility:hidden;transition:transform .45s cubic-bezier(.3,1.5,.5,1),visibility 0s .45s}
.sheet.show{transform:none;visibility:visible;transition-delay:0s}
.sheet h3{font-size:20px}
.sheet .sp{font-size:13px;margin:4px 0 12px;opacity:.8;word-break:break-all;max-height:4.8em;overflow:hidden}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.sgrid a,.sgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-decoration:none;background:none;border:0;cursor:pointer;color:inherit}
.sgrid i{display:grid;place-items:center;width:54px;height:54px;border:3px solid var(--ink);border-radius:20px;font-style:normal;font-size:20px;box-shadow:3px 3px 0 var(--ink);transition:transform .15s}
.sgrid a:active i,.sgrid button:active i{transform:translate(3px,3px);box-shadow:none}
.sheet .close{margin:16px auto 0;display:flex}
.toast{position:fixed;z-index:300;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,160%);background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 20px;font-size:15px;transition:transform .4s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}

/* ───────── 減少動態效果 ───────── */
@media (prefers-reduced-motion: reduce){
  html:not(.motion-on),html:not(.motion-on) *,html:not(.motion-on) *::before,html:not(.motion-on) *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
html.reduce,html.reduce *,html.reduce *::before,html.reduce *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.reduce .title span{opacity:1}
html.reduce .cl,html.reduce .fly{animation:none!important}
</style>

const state={start:LS.get('kyu.start2','2027-03-07'),f:LS.get('kyu.f',{}),todo:LS.get('kyu.todo',{done:{},custom:[]}),day:0};
const WD=['日','一','二','三','四','五','六'];
const dayDate=i=>{const [y,m,d]=state.start.split('-').map(Number);return new Date(y,m-1,d+i)};
const fmt=i=>{const x=dayDate(i);return {y:x.getFullYear(),md:`${x.getMonth()+1}/${x.getDate()}`,wd:WD[x.getDay()],full:`${x.getMonth()+1}/${x.getDate()}（${WD[x.getDay()]}）`}};

let reduce=LS.get('kyu.reduce',null);
const mq=matchMedia('(prefers-reduced-motion: reduce)');
const isReduced=()=>reduce===null?mq.matches:reduce;
const mapURL=k=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(PLACES[k].q);
const dirURL=(a,b,mode='driving')=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(PLACES[a].q)+'&destination='+encodeURIComponent(PLACES[b].q)+'&travelmode='+mode;
function routeURL(day){const s=day.stops;const mid=s.slice(1,-1).map(k=>encodeURIComponent(PLACES[k].q)).join('%7C');return dirURL(s[0],s[s.length-1],'driving')+(mid?'&waypoints='+mid:'')}

const shareBtn=o=>`<button class="btn sm" type="button" data-act="share" data-sid="${reg(o)}">${ic('i-share')}分享</button>`;

let lastS=-1;
function tickCount(){
  const now=new Date(),s=startAt(),e=dayDate(5);
  const set=(d,h,m,sec)=>{$('#cdD').textContent=d;$('#cdH').textContent=h;$('#cdM').textContent=m;const el=$('#cdS');el.textContent=sec;if(!isReduced()&&sec!==lastS){el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick')}lastS=sec};
  const car=p=>{$('#tkCar').style.left=`calc(${(p*100).toFixed(2)}% - ${(p*42).toFixed(1)}px)`};
  if(now<s){
    let t=Math.floor((s-now)/1000);
    const d=Math.floor(t/86400);t%=86400;const h=Math.floor(t/3600);t%=3600;
    set(d,String(h).padStart(2,'0'),String(Math.floor(t/60)).padStart(2,'0'),String(t%60).padStart(2,'0'));
    $('#cdTitle').textContent='距離出發還有';
    $('#heroLeft').textContent=d>0?`倒數 ${d} 天`:'今天出發';
    $('#cdMsg').textContent=d>100?'還有一段時間，先慢慢把預約與待辦清單準備好。':d>60?'高千穗峽划船和動物園可以開始預約了。':d>30?'開始留意天氣，確認租車與雪胎。':d>7?'進入倒數衝刺，最後確認預約與租車。':d>0?'快出發了，把行李收好，準備去九州！':'今天就是出發日，一路平安！';
    car(clamp(1-(s-now)/(180*864e5),0,1));
  }else if(now<e){
    const n=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-dayDate(0))/864e5)+1;
    set(0,'00','00','00');
    $('#cdTitle').textContent='旅程進行中';
    $('#heroLeft').textContent=`Day ${n} 進行中`;
    $('#cdMsg').textContent=`今天是 Day ${n}，祝你玩得開心。`;
    car(1);
  }else{
    set(0,'00','00','00');
    $('#cdTitle').textContent='這趟旅程已經結束';
    $('#heroLeft').textContent='旅程已結束';
    $('#cdMsg').textContent='想重新規劃？在下方選一個新的出發日期就能重新倒數。';
    car(1);
  }
}

          <div class="step"><button class="btn sm" type="button" data-act="step" data-d="-1" id="prevBtn">◀ 上一站</button><button class="btn sm fill" type="button" data-act="step" data-d="1" id="nextBtn">下一站 ▶</button><a class="btn sm" id="curMap" target="_blank" rel="noopener">${ic('i-pin')}此站地圖</a></div>
        </div>
      </div>
      <ol class="tlist" id="tlist">${day.items.map(it=>itemHTML(day,it)).join('')}</ol>
    </div></div>`;
  if(anim&&!isReduced()){const p=$('#dayPanel');p.classList.remove('swap');void p.offsetWidth;p.classList.add('swap')}
  initScene(day);
}

/* ═════════ 3D 場景 ═════════ */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function layout(day){
  const st=day.stops.map(k=>PLACES[k]);
  const lat0=st.reduce((a,p)=>a+p.lat,0)/st.length,kx=Math.cos(lat0*Math.PI/180);
  let pts=st.map(p=>({x:p.lng*kx,y:-p.lat}));
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const span=Math.max(maxX-minX,maxY-minY)||1,size=66,cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  pts=pts.map(p=>({x:50+(p.x-cx)/span*size,y:50+(p.y-cy)/span*size}));
  const MIN=22;
  for(let it=0;it<60;it++){
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      let dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y,d=Math.hypot(dx,dy);
      if(d<MIN){if(d<.01){dx=1;dy=0;d=1}const push=(MIN-d)/2,ux=dx/d,uy=dy/d;pts[i].x-=ux*push;pts[i].y-=uy*push;pts[j].x+=ux*push;pts[j].y+=uy*push}
    }
    pts.forEach(p=>{p.x=clamp(p.x,12,88);p.y=clamp(p.y,14,90)});
  }
  return pts;
}
function buildEdges(day,pts){
  const pairs=day.edges||pts.slice(1).map((_,i)=>[i,i+1]);
  return pairs.map(([a,b],k)=>{
    const A=pts[a],B=pts[b],dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,off=(k%2?-1:1)*Math.min(8,len*.18);
    return {a,b,A,B,C:{x:(A.x+B.x)/2-dy/len*off,y:(A.y+B.y)/2+dx/len*off}};
  });
}
function sceneHTML(day){
  const r=rng(day.n*7919+3),pts=S.pts;
  const free=(minD)=>{for(let t=0;t<40;t++){const x=10+r()*80,y=12+r()*78;if(pts.every(p=>Math.hypot(p.x-x,p.y-y)>minD))return{x,y}}return{x:8,y:10}};
  let g='';
  for(let i=0;i<7;i++){g+=`<ellipse cx="${10+r()*80}" cy="${10+r()*80}" rx="${7+r()*10}" ry="${5+r()*8}" fill="#CBE5B6"/>`}
  const pd=free(18);g+=`<ellipse cx="${pd.x}" cy="${pd.y}" rx="9" ry="6" fill="#A8D3E6" stroke="#3E3A39" stroke-width=".6"/>`;
  const d=S.edges.map(e=>`M${e.A.x.toFixed(2)} ${e.A.y.toFixed(2)}Q${e.C.x.toFixed(2)} ${e.C.y.toFixed(2)} ${e.B.x.toFixed(2)} ${e.B.y.toFixed(2)}`).join('');
  let trees='';
  for(let i=0;i<6;i++){const p=free(14);trees+=`<div class="pin tree" style="left:${p.x}%;top:${p.y}%"><svg viewBox="0 0 40 56"><use href="#i-tree"/></svg></div>`}
  let pins='';
  pts.forEach((p,i)=>{const pl=PLACES[day.stops[i]];
    pins+=`<i class="sh" style="left:${p.x}%;top:${p.y}%"></i><i class="gm" data-g="${i}" style="left:${p.x}%;top:${p.y}%"></i>`;
  });
  pts.forEach((p,i)=>{const pl=PLACES[day.stops[i]];
    pins+=`<button class="pin" type="button" data-i="${i}" style="left:${p.x}%;top:${p.y}%" aria-label="第 ${i+1} 站 ${esc(pl.name)}"><span class="lab">${pl.short}</span><span class="badge">${i+1}</span><svg class="lm" viewBox="0 0 64 64"><use href="#lm-${pl.lm}"/></svg></button>`;
  });
  const clouds=[[26,34],[74,60]].map(([x,y],i)=>`<i class="csh" style="--cx:${x}%;--cy:${y}%;animation-delay:${-i*5}s"></i><div class="cloud" style="--cx:${x}%;--cy:${y}%;animation-delay:${-i*5}s"><svg viewBox="0 0 64 40"><use href="#i-cloud"/></svg></div>`).join('');
  return `<i class="slab s3"></i><i class="slab s2"></i><i class="slab s1"></i>
  <svg class="ground" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${g}</svg>
  <svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${d}" stroke="#3E3A39" stroke-width="3.6"/><path d="${d}" stroke="#FFFCF6" stroke-width="2.1"/><path class="dash" d="${d}" stroke="#F2A497" stroke-width=".7" stroke-dasharray="2.2 2.2"/></g></svg>
  ${trees}${pins}${clouds}
  <div class="pin carpin" id="carEl" style="left:${pts[0].x}%;top:${pts[0].y}%"><svg viewBox="0 0 64 48"><use href="#i-car"/></svg></div>`;
}
function initScene(day){
  S.day=day;S.stage=$('#stage');S.world=$('#world');S.idx=0;S.move=null;
  S.pts=layout(day);S.edges=buildEdges(day,S.pts);
  S.world.innerHTML=sceneHTML(day);
  S.carEl=$('#carEl');
  S.stage.addEventListener('pointerdown',e=>{
    S.drag={x:e.clientX,y:e.clientY,rx:S.rx,rz:S.rz,id:e.pointerId,moved:false};
  });
  if(S.io)S.io.disconnect();
  S.io=new IntersectionObserver(es=>{S.vis=es[0].isIntersecting;if(S.vis)kick()},{rootMargin:'80px'});
  S.io.observe(S.stage);
  setActive(0,true);
  S.world.style.setProperty('--rx',S.rx+'deg');S.world.style.setProperty('--rz',S.rz+'deg');
  kick();
}
function setCar(x,y,dx){
  if(!S.carEl)return;
  S.carEl.style.left=x+'%';S.carEl.style.top=y+'%';
  if(Math.abs(dx)>.1)S.carEl.firstElementChild.style.transform=dx<0?'scaleX(-1)':'none';
}
function pathPos(a,b,e){
  const A=S.pts[a],B=S.pts[b];
  const ed=S.edges.find(q=>(q.a===a&&q.b===b)||(q.a===b&&q.b===a));
  if(!ed)return{x:A.x+(B.x-A.x)*e,y:A.y+(B.y-A.y)*e,dx:B.x-A.x};
  const fwd=ed.a===a,t=fwd?e:1-e,u=1-t;
  return{x:u*u*ed.A.x+2*u*t*ed.C.x+t*t*ed.B.x,y:u*u*ed.A.y+2*u*t*ed.C.y+t*t*ed.B.y,dx:(fwd?1:-1)*(ed.B.x-ed.A.x)};
}
function setActive(i,instant,scroll){
  const day=S.day,prev=S.idx;
  i=clamp(i,0,day.stops.length-1);S.idx=i;
  $$('.pin[data-i]',S.world).forEach(p=>p.classList.toggle('on',+p.dataset.i===i));
  $$('.gm',S.world).forEach(p=>p.classList.toggle('on',+p.dataset.g===i));
  $$('#tlist .tl').forEach(li=>li.classList.toggle('on',+li.dataset.stop===i));
  const cur=PLACES[day.stops[i]],nk=day.stops[i+1];
  $('#curName').innerHTML=`<span class="num">${i+1}</span>${cur.name}`;
  $('#curMap').href=mapURL(day.stops[i]);
  let nx='';
  if(nk){
    const leg=day.items.find(x=>x.type==='drive'&&x.to===nk&&x.from===day.stops[i]);
    const lt=leg?[leg.time,leg.dur].filter(Boolean).join('　'):'';
    nx=`下一站｜<b style="font-weight:400">${i+2}　${PLACES[nk].name}</b>　<span class="leg">${day.noCar?'各自前往':'自駕'}${lt?' '+lt:''}</span> <a class="btn sm" style="margin-left:4px" href="${dirURL(day.stops[i],nk,day.noCar?'transit':'driving')}" target="_blank" rel="noopener">${ic('i-nav')}導航</a>`;
  }else nx='這是今天的最後一站，辛苦了。';
  $('#nextInfo').innerHTML=nx;
  $('#prevBtn').disabled=i===0;$('#nextBtn').disabled=i===day.stops.length-1;
  if(instant||prev===i){const p=S.pts[i];setCar(p.x,p.y,0)}
  else S.move={a:prev,b:i,t0:performance.now(),dur:1100};
  if(scroll&&matchMedia('(min-width:900px)').matches){const el=$('#tlist .tl.on');el&&el.scrollIntoView({block:'center',behavior:isReduced()?'auto':'smooth'})}
  kick();
}
function tick(t){
  S.raf=0;if(!S.world||!S.vis)return;
  let busy=false;
  if(!S.drag){const a=S.trx-S.rx,b=S.trz-S.rz;if(Math.abs(a)>.05||Math.abs(b)>.05){S.rx+=a*.16;S.rz+=b*.16;busy=true}else{S.rx=S.trx;S.rz=S.trz}}
  const sway=(!isReduced()&&!S.drag)?Math.sin(t/1700)*2.2:0;
  S.world.style.setProperty('--rx',S.rx.toFixed(2)+'deg');
  S.world.style.setProperty('--rz',(S.rz+sway).toFixed(2)+'deg');
  if(S.move){
    const m=S.move,p=isReduced()?1:clamp((t-m.t0)/m.dur,0,1),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,pos=pathPos(m.a,m.b,e);
    setCar(pos.x,pos.y,pos.dx);
    if(p>=1)S.move=null;else busy=true;
  }
  if(busy||!isReduced())S.raf=requestAnimationFrame(tick);
}
window.addEventListener('pointermove',e=>{
  const d=S.drag;if(!d||e.pointerId!==d.id)return;
  const dx=e.clientX-d.x,dy=e.clientY-d.y;
  if(!d.moved){if(Math.hypot(dx,dy)<3)return;d.moved=true;S.stage.classList.add('drag');try{S.stage.setPointerCapture(e.pointerId)}catch(_){}}
  S.rz=S.trz=clamp(d.rz+dx*.6,-180,180);
  S.rx=S.trx=clamp(d.rx-dy*.4,6,78);
  kick();
});
const endDrag=e=>{const d=S.drag;if(!d||(e&&e.pointerId!==d.id))return;S.drag=null;S.stage&&S.stage.classList.remove('drag');kick()};
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);

/* ═════════ 清單 ═════════ */
function renderInfos(){
  $('#infos').innerHTML=INFOS.map(g=>`<details class="info c-${g.c}"${g.open?' open':''}><summary>${ic(g.icon)}${g.t}</summary><ol>${g.items.map(([a,b])=>`<li><span><b>${a}</b>${b}</span></li>`).join('')}</ol></details>`).join('');
}
function chkHTML(id,title,sub,custom){
  const on=state.todo.done[id]?' checked':'';
  return `<label class="chk"><input type="checkbox" data-id="${esc(id)}"${on}><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></svg></span><span class="txt"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span>${custom?`<button type="button" class="del" data-act="todo-del" data-id="${esc(id)}" aria-label="刪除">×</button>`:''}</label>`;
}
function renderTodo(){
  const groups=TODO.map(g=>`<section class="tg c-${g.c}"><h4>${g.g}</h4>${g.items.map(([id,t,s])=>chkHTML(id,t,s,false)).join('')}</section>`).join('');
  const custom=`<section class="tg c-lav"><h4>自己加的</h4>${state.todo.custom.map(c=>chkHTML(c.id,c.text,'',true)).join('')}<div class="addrow"><input id="todoNew" placeholder="新增一項待辦" maxlength="40"><button class="btn sm fill" type="button" data-act="todo-add">加入</button></div></section>`;
  $('#todoBox').innerHTML=`<div class="prog-row"><div class="prog" aria-hidden="true"><i id="progBar"></i></div><span class="prog-txt" id="progTxt"></span></div><p class="prog-msg" id="progMsg"></p><div class="todo-grid">${groups}${custom}</div>`;
  updateProg();
}
function updateProg(){
  const ids=[...TODO.flatMap(g=>g.items.map(i=>i[0])),...state.todo.custom.map(c=>c.id)];
  const done=ids.filter(id=>state.todo.done[id]).length,total=ids.length,pct=total?Math.round(done/total*100):0;
  $('#progBar').style.width=pct+'%';
  $('#progTxt').textContent=`已完成 ${done}／${total}`;
  $('#progMsg').textContent=pct===100?'行前準備完成，可以出發了！':pct>=50?'過半了，剩下的慢慢補齊。':'先從需要預約的項目開始。';
}

/* ═════════ 住宿 ═════════ */
function renderStays(){
  $('#stays').innerHTML=STAYS.map(s=>{
    const f=fmt(s.day-1),pl=PLACES[s.key];
    const addr=s.addr||'';
    const text=`Day ${s.day} ${f.full} 住宿｜${s.name}\n${addr?addr+'\n':''}入住 ${s.checkin}`;
    return `<article class="card stay c-${s.c}">
      <div class="stay-top"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#lm-${pl.lm}"/></svg><div><h3>${s.name}</h3><small>${s.area}</small></div><span class="night">第 ${s.night} 晚</span></div>
      <div class="stay-bot"><dl class="kv"><dt>日期</dt><dd>Day ${s.day}｜${f.full}</dd><dt>入住</dt><dd>${s.checkin}</dd>${addr?`<dt>地址</dt><dd>${addr}</dd>`:''}${s.rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
      <div class="acts">${mapBtn(s.key)}${addr?`<button class="btn sm" type="button" data-act="copy" data-text="${esc(addr)}">${ic('i-copy')}複製地址</button>`:''}${shareBtn({title:s.name,text,url:mapURL(s.key)})}</div></div></article>`;
  }).join('');
  const f=fmt(4);
  $('#checkout').innerHTML=`<div><b style="font-weight:400;font-size:18px">Day 5｜${f.full} 退房</b><p style="font-size:14px">08:00–10:00 辦理退房，之後依個人班機時間前往機場。</p></div><div class="acts" style="margin-top:0">${mapBtn('hotel4')}</div>`;
}

/* ═════════ 分享 ═════════ */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
async function copyText(text,msg){
  try{await navigator.clipboard.writeText(text)}
  catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}
  toast(msg||'已複製');
}
let sheetLast=null;
function openShare(o){
  const text=o.text,url=o.url||'';
  const full=url?`${text}\n${url}`:text;
  $('#shTitle').textContent='分享：'+o.title;
  $('#shText').textContent=full;
  const t=encodeURIComponent(text),u=encodeURIComponent(url),tu=encodeURIComponent(full);
  const items=[];
  if(navigator.share)items.push(['b','系統分享','↗','var(--yellow)',{act:'native'}]);
  items.push(['a','LINE','L','var(--green)',{href:`https://line.me/R/share?text=${tu}`}]);
  if(url)items.push(['a','Facebook','f','var(--sky)',{href:`https://www.facebook.com/sharer/sharer.php?u=${u}`}]);
  items.push(['a','WhatsApp','W','var(--green)',{href:`https://wa.me/?text=${tu}`}]);
  items.push(['a','Telegram','T','var(--sky)',{href:`https://t.me/share/url?url=${u||encodeURIComponent('https://www.google.com/maps')}&text=${t}`}]);
  items.push(['a','Email','@','var(--lav)',{href:`mailto:?subject=${encodeURIComponent(o.title)}&body=${tu}`}]);
  items.push(['b','複製內容','⧉','var(--coral)',{act:'copyall'}]);
  $('#shGrid').innerHTML=items.map(([k,label,ch,bg,x])=>k==='a'
    ?`<a href="${x.href}" target="_blank" rel="noopener"><i style="background:${bg}">${ch}</i>${label}</a>`
    :`<button type="button" data-sheet="${x.act}"><i style="background:${bg}">${ch}</i>${label}</button>`).join('');
  sheetLast={o,full};
  $('#sheet').classList.add('show');$('#sheetBg').classList.add('show');$('#sheet').setAttribute('aria-hidden','false');
}
function closeShare(){$('#sheet').classList.remove('show');$('#sheetBg').classList.remove('show');$('#sheet').setAttribute('aria-hidden','true')}
function shareAll(){
  const lines=DAYS.map(d=>`Day ${d.n} ${fmt(d.n-1).full}　${d.route}`).join('\n');
  const a=fmt(0),b=fmt(4);
  openShare({title:'九州自駕 5天4夜',text:`九州自駕 5天4夜（${a.y}/${a.md}–${b.md}）\n${lines}`,url:/^https?:/.test(location.href)?location.href.split('#')[0]:''});
}

/* ═════════ 事件 ═════════ */
document.addEventListener('click',e=>{
  const sb=e.target.closest('[data-sheet]');
  if(sb&&sheetLast){
    if(sb.dataset.sheet==='native'){navigator.share({title:sheetLast.o.title,text:sheetLast.o.text,url:sheetLast.o.url||undefined}).catch(()=>{});}
    else copyText(sheetLast.full,'已複製分享內容');
    return;
  }
  const pin=e.target.closest('.pin[data-i]');
  if(pin){setActive(+pin.dataset.i,false,true);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='tab'){const i=+b.dataset.i;if(i!==state.day){state.day=i;renderTabs();renderDay(true)}}
  else if(act==='step')setActive(S.idx+ +b.dataset.d,false,true);
  else if(act==='focus'){setActive(+b.dataset.stop,false);$('#sceneCard').scrollIntoView({block:'center',behavior:isReduced()?'auto':'smooth'})}
  else if(act==='view'){
    const v=b.dataset.v;
    if(v==='tilt'){S.trx=56;S.trz=-18}else if(v==='top'){S.trx=10;S.trz=0}else if(v==='left'){S.trz-=35}else{S.trz+=35}
    if(isReduced()){S.rx=S.trx;S.rz=S.trz}
    kick();
  }
  else if(act==='share')openShare(SH[+b.dataset.sid]);
  else if(act==='share-all')shareAll();
  else if(act==='copy')copyText(b.dataset.text,'已複製地址');
  else if(act==='close-sheet')closeShare();
  else if(act==='motion'){reduce=!isReduced();LS.set('kyu.reduce',reduce);applyReduce();toast(reduce?'已減少動態效果':'動畫已開啟')}
  else if(act==='todo-add')addTodo();
  else if(act==='todo-del'){const id=b.dataset.id;state.todo.custom=state.todo.custom.filter(c=>c.id!==id);delete state.todo.done[id];LS.set('kyu.todo',state.todo);renderTodo()}
});
$('#sheetBg').addEventListener('click',closeShare);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare();if(e.key==='Enter'&&e.target.id==='todoNew')addTodo()});
document.addEventListener('change',e=>{
  const c=e.target.closest('.chk input');
  if(c){state.todo.done[c.dataset.id]=c.checked;LS.set('kyu.todo',state.todo);updateProg();return}
  if(e.target.id==='startInput'&&e.target.value){state.start=e.target.value;LS.set('kyu.start2',state.start);renderHeroDates();renderPasses();renderTabs();renderDay(true);renderStays();lastS=-1;tickCount()}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){state.f[k]=e.target.value;LS.set('kyu.f',state.f)}});
function addTodo(){
  const inp=$('#todoNew');const v=(inp.value||'').trim();if(!v)return;
  state.todo.custom.push({id:'c'+Date.now(),text:v});LS.set('kyu.todo',state.todo);renderTodo();$('#todoNew').focus();
}

/* ═════════ 捲動：導覽高亮、視差、公路進度 ═════════ */
const secs=['home','flight','days','todo','stay'];
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){$$('#links a').forEach(a=>a.classList.toggle('on',a.dataset.sec===en.target.id))}})},{rootMargin:'-35% 0px -60% 0px'});
secs.forEach(id=>io.observe($('#'+id)));
let sTick=false;
addEventListener('scroll',()=>{
  if(sTick)return;sTick=true;
  requestAnimationFrame(()=>{
    sTick=false;
    const y=scrollY,max=document.documentElement.scrollHeight-innerHeight,p=max>0?clamp(y/max,0,1):0;
    $('#roadCar').style.left=`calc(${(p*100).toFixed(2)}% - ${(p*26).toFixed(1)}px)`;
    $('#home').style.setProperty('--py',isReduced()?'0px':Math.min(y,600)*.08+'px');
  });
},{passive:true});
mq.addEventListener&&mq.addEventListener('change',()=>{if(reduce===null)applyReduce()});

/* ═════════ 啟動 ═════════ */
state.day=inTripDay();
applyReduce();
renderHeroDates();renderPasses();renderTabs();renderDay(false);renderInfos();renderTodo();renderStays();
tickCount();setInterval(tickCount,1000);
})();
</script>
